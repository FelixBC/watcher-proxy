name: installer-repro

# Headless reproduction of the WinConfig visual installer's ACTUAL install path on
# a real Windows box. The WinForms window can't be driven without a desktop, but the
# thing that "nunca instala nada" is the handoff underneath it — and THAT we can run
# and assert here. See scripts/ci/headless-install-test.ps1.

on:
  workflow_dispatch:
  push:
    branches: [fix/installer-visual, feature/uninstall-visual]
  pull_request:
    paths:
      - 'InstallWatcher.bat'
      - 'WatcherBrain/WinConfigWizard.ps1'
      - 'WatcherBrain/AskIdentity.ps1'
      - 'scripts/installer/**'
      - 'scripts/ci/**'
      - '.github/workflows/installer-repro.yml'

jobs:
  headless-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage checkout to C:\WinConfig (mimic real extraction)
        shell: powershell
        run: |
          $dst = 'C:\WinConfig'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          robocopy $env:GITHUB_WORKSPACE $dst /E /XD .git .github /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed ($LASTEXITCODE)" }
          $global:LASTEXITCODE = 0
          Write-Host "Staged. Top-level:"
          Get-ChildItem $dst | Select-Object Name | Format-Table -AutoSize | Out-String | Write-Host

      - name: Run headless install (wizard handoff)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\WinConfig\scripts\ci\headless-install-test.ps1

      - name: Wizard PowerShell parses clean
        if: always()
        shell: powershell
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile('C:\WinConfig\WatcherBrain\WinConfigWizard.ps1', [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Host $_.Message }; throw "wizard has parse errors" }
          Write-Host "WinConfigWizard.ps1 parses clean."

      - name: Wizard WinForms builds without throwing (both modes)
        shell: powershell
        run: |
          $env:WINCONFIG_WIZARD_SELFTEST = '1'
          foreach ($mode in @('Install','Uninstall')) {
            $out = & powershell -NoProfile -ExecutionPolicy Bypass -STA -File 'C:\WinConfig\WatcherBrain\WinConfigWizard.ps1' -Mode $mode 2>&1 | Out-String
            Write-Host $out.Trim()
            if ($out -notmatch 'SELFTEST OK') { throw "wizard form did not construct for -Mode $mode" }
          }
          Write-Host "Both wizard modes construct their WinForms window without error."

      - name: Collect logs on failure
        if: always()
        shell: powershell
        run: |
          foreach ($f in @('C:\WinConfig\WatcherBrain\wizard-error.log','C:\WinConfig\WatcherBrain\register-status.txt','C:\WinConfig\WatcherBrain\events.log')) {
            if (Test-Path $f) { Write-Host "----- $f -----"; Get-Content $f -Raw }
          }

  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile the launcher, then stamp it as Install.exe and Uninstall.exe
        shell: powershell
        run: |
          $csc = Get-ChildItem 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe' -ErrorAction SilentlyContinue
          if (-not $csc) { $csc = Get-ChildItem 'C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe' -ErrorAction SilentlyContinue }
          if (-not $csc) { throw "csc.exe (.NET Framework) not found" }
          Write-Host "Using $($csc.FullName)"
          Push-Location scripts\installer
          # ONE source (Launcher.cs) -> ONE binary -> TWO renamed copies. The exe picks
          # Install vs Uninstall from its OWN file name at runtime, so the two shipped
          # launchers are byte-identical and cannot drift.
          & $csc.FullName /nologo /target:winexe /win32icon:winconfig.ico /win32manifest:Launcher.manifest /out:Launcher.exe Launcher.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed ($LASTEXITCODE)" }
          Copy-Item Launcher.exe Install.exe -Force
          Copy-Item Launcher.exe Uninstall.exe -Force
          Pop-Location

      - name: Verify both exes (PE + embedded requireAdministrator)
        shell: powershell
        run: |
          foreach ($name in @('Install.exe','Uninstall.exe')) {
            $exe = "scripts\installer\$name"
            if (-not (Test-Path $exe)) { throw "$name not produced" }
            $bytes = [IO.File]::ReadAllBytes($exe)
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "$name is not a PE (no MZ header)" }
            $text = [Text.Encoding]::UTF8.GetString($bytes)
            if ($text -notmatch 'requireAdministrator') { throw "$name manifest NOT embedded (requireAdministrator missing)" }
            Write-Host ("OK - {0}: {1} bytes, MZ header present, requireAdministrator embedded." -f $name, $bytes.Length)
          }

      - name: Confirm the shipped launchers are committed at the repo root
        shell: powershell
        run: |
          # The binaries that actually ship live at the repo root (git-tracked), built
          # from Launcher.cs per scripts/installer/README.md. This job proves the SOURCE
          # still compiles into a valid elevated PE; it does not byte-compare against the
          # committed copies (Framework csc here vs. the Roslyn build used to produce the
          # committed exes are not bit-identical). Just assert both are present so a
          # rename/removal can't silently drop a shipped launcher.
          foreach ($name in @('Install.exe','Uninstall.exe')) {
            if (-not (Test-Path ".\$name")) { throw "$name is not committed at the repo root" }
            $bytes = [IO.File]::ReadAllBytes(".\$name")
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "committed $name is not a PE" }
            $text = [Text.Encoding]::UTF8.GetString($bytes)
            if ($text -notmatch 'requireAdministrator') { throw "committed $name is not elevated (requireAdministrator missing)" }
            Write-Host ("OK - committed $name present, PE, elevated.")
          }

      - name: Upload the launcher exes artifact
        uses: actions/upload-artifact@v4
        with:
          name: winconfig-launchers
          path: |
            scripts/installer/Install.exe
            scripts/installer/Uninstall.exe
          if-no-files-found: error

  build-bundle:
    # Build the SHIPPED zip with the real build script. On Linux because the
    # script needs `zip` (absent from the windows-latest git-bash).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the WinConfig bundle
        run: bash scripts/build-winconfig-bundle.sh
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: winconfig-bundle
          path: dist/winconfig-install.zip
          if-no-files-found: error

  install-from-bundle:
    # Gold-standard: extract the SHIPPED zip exactly like install.ps1 does (top
    # folder "WinConfig" -> C:\WinConfig) and install headless from there. Proves
    # the actual downloadable artifact installs - not just a raw checkout.
    needs: build-bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the built bundle
        uses: actions/download-artifact@v4
        with:
          name: winconfig-bundle
          path: bundle

      - name: Extract to C:\WinConfig (as install.ps1 does)
        shell: powershell
        run: |
          Expand-Archive -Path bundle\winconfig-install.zip -DestinationPath C:\ -Force
          if (-not (Test-Path 'C:\WinConfig\InstallWatcher.bat')) { throw "bundle did not extract to C:\WinConfig" }
          Write-Host ("scripts/ci present in bundle (should be False): {0}" -f (Test-Path 'C:\WinConfig\scripts\ci'))

      - name: Install headless from the extracted bundle
        shell: powershell
        run: |
          # The harness is intentionally excluded from the bundle, so run the
          # workspace copy against the real extracted install root.
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\ci\headless-install-test.ps1" -InstallRoot 'C:\WinConfig'
